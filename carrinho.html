<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carrinho de Compras | R&S Makeup</title>
  <link rel="icon" href="https://i.postimg.cc/rmd8bnBB/LOGO-RS-MAKEUP.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #D4A373;
      --brown: #2B2B2B;
      --beige: #F8F5F2;
      --text-muted: #6B6B6B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: #fafafa;
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAVBAR ── */
    .nav {
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      box-shadow: 0 2px 15px rgba(0,0,0,.03);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .nav-logo img { height: 40px; }
    
    .btn-back {
      text-decoration: none;
      color: var(--brown);
      font-weight: 600;
      font-size: .85rem;
      transition: color .3s;
    }
    .btn-back:hover { color: var(--gold); }

    /* ── CONTAINER ── */
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 2rem;
      text-align: center;
      color: var(--brown);
    }

    .empty-cart {
      text-align: center;
      padding: 4rem 1rem;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.03);
    }
    .empty-cart p {
      color: var(--text-muted);
      margin: 1rem 0 2rem;
    }
    .btn-primary {
      display: inline-block;
      background: var(--brown);
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      font-size: .85rem;
      letter-spacing: 1px;
      transition: all .3s;
    }
    .btn-primary:hover { background: var(--gold); }

    .cart-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 1rem;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.03);
      gap: 1.5rem;
      position: relative;
    }

    .item-img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background: #f5f5f5;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }
    .item-name { font-weight: 700; font-size: 1rem; margin-bottom: .2rem; line-height: 1.2; }
    .item-var { font-size: .75rem; color: var(--text-muted); margin-bottom: .5rem; font-weight: 600;}
    .item-price { font-weight: 700; color: var(--gold); font-size: 1.1rem; }

    .item-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      background: #f9f9f9;
      border-radius: 50px;
      overflow: hidden;
      border: 1px solid #eee;
    }
    .qty-btn {
      background: none;
      border: none;
      padding: .5rem .8rem;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--brown);
    }
    .qty-btn:hover { background: #eee; }
    .qty-val {
      font-weight: 700;
      font-size: .9rem;
      min-width: 25px;
      text-align: center;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: .75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    .remove-btn:hover { text-decoration: underline; }

    /* ── RESUMO ── */
    .cart-summary {
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      margin-top: 2rem;
    }
    
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .summary-total {
      font-weight: 800;
      font-size: 1.5rem;
      border-top: 2px solid #eee;
      padding-top: 1rem;
      margin-bottom: 1.5rem;
    }

    .btn-wpp-final {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 1.2rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all .3s;
      box-shadow: 0 8px 24px rgba(37, 211, 102, .25);
      width: 100%;
      border: none;
      cursor: pointer;
    }
    .btn-wpp-final:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(37, 211, 102, .35);
    }

    @media(max-width: 600px) {
      .cart-item { flex-direction: column; align-items: stretch; gap: 1rem; }
      .item-actions { flex-direction: row; justify-content: space-between; align-items: center; }
      .qty-ctrl { margin-left: auto; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-logo"><a href="index.html"><img src="https://i.postimg.cc/rmd8bnBB/LOGO-RS-MAKEUP.png" alt="R&S Makeup"></a></div>
    <div>
      <a href="index.html" class="btn-back" style="margin-right: 15px;">← Continuar Comprando</a>
    </div>
  </nav>

  <main class="container">
    <h1>Seu Carrinho</h1>
    
    <div id="cart-content">
      <!-- Injected by JS -->
    </div>
  </main>

  <script>
    function formatBRL(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

    let appliedCoupon = null;

    function applyCoupon() {
      const input = document.getElementById('couponInput').value.trim();
      const msg = document.getElementById('couponMsg');
      
      const config = JSON.parse(localStorage.getItem('rs_coupon_cfg')) || { active: true, code: 'Obrigada10', discount: 10 };
      
      if (!config.active) {
        msg.textContent = 'Cupom indisponível no momento.';
        msg.style.color = '#e74c3c';
        appliedCoupon = null;
        return;
      }
      
      if (input.toLowerCase() === config.code.toLowerCase() && config.code !== '') {
        appliedCoupon = { code: config.code, discount: config.discount };
        renderCart();
      } else {
        appliedCoupon = null;
        msg.textContent = 'Cupom inválido';
        msg.style.color = '#e74c3c';
      }
    }

    function removeCoupon() {
      appliedCoupon = null;
      renderCart();
    }

    function getCart() {
      return JSON.parse(localStorage.getItem('rs_cart')) || [];
    }

    function saveCart(cart) {
      localStorage.setItem('rs_cart', JSON.stringify(cart));
      renderCart();
    }

    function updateQty(index, delta) {
      const cart = getCart();
      cart[index].quantidade += delta;
      
      if(cart[index].quantidade <= 0) {
        cart.splice(index, 1);
      }
      
      saveCart(cart);
    }

    function removeItem(index) {
      const cart = getCart();
      cart.splice(index, 1);
      saveCart(cart);
    }

    function getStoreWpp() {
      return localStorage.getItem('rs_wpp') || '5531999999999';
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
            <h2>Seu carrinho está vazio</h2>
            <p>Parece que você ainda não adicionou nenhum produto.</p>
            <a href="index.html" class="btn-primary">Explorar Produtos</a>
          </div>
        `;
        return;
      }

      let total = 0;
      const htmlList = cart.map((item, index) => {
        const itemTotal = item.preco * item.quantidade;
        total += itemTotal;
        const varText = item.variacao ? `<div class="item-var">${item.variacao}</div>` : '';
        
        return `
          <div class="cart-item">
            <img src="${item.imagem}" class="item-img" alt="${item.nome}" onerror="this.src='https://via.placeholder.com/100?text=Sem+Foto'">
            <div class="item-info">
              <div class="item-name">${item.nome}</div>
              ${varText}
              <div class="item-price">${formatBRL(item.preco)}</div>
            </div>
            <div class="item-actions">
              <button class="remove-btn" onclick="removeItem(${index})">Remover</button>
              <div class="qty-ctrl">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-val">${item.quantidade}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const couponHtml = `
        <div style="background:#fff; padding:1.5rem; border-radius:16px; margin-top:1.5rem; box-shadow:0 4px 15px rgba(0,0,0,.03);">
          <h3 style="font-size:1rem; margin-bottom:1rem; font-family:'Playfair Display',serif; color:var(--brown);">Tem um cupom de desconto?</h3>
          <div style="display:flex; gap:.8rem;">
            <input type="text" id="couponInput" value="${appliedCoupon ? appliedCoupon.code : ''}" placeholder="Digite seu cupom" style="flex:1; padding:.8rem 1rem; border:1px solid #eee; border-radius:8px; font-family:inherit; font-size:.9rem; outline:none;" ${appliedCoupon ? 'disabled' : ''}>
            <button onclick="${appliedCoupon ? 'removeCoupon()' : 'applyCoupon()'}" style="background:${appliedCoupon ? '#e74c3c' : 'var(--brown)'}; color:#fff; border:none; padding:0 1.5rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:.85rem; text-transform:uppercase; transition:all .3s;">${appliedCoupon ? 'Remover' : 'Aplicar'}</button>
          </div>
          <div id="couponMsg" style="margin-top:.8rem; font-size:.85rem; font-weight:600; color:${appliedCoupon ? '#1e8e3e' : ''}">${appliedCoupon ? 'Cupom aplicado com sucesso! 🎉' : ''}</div>
        </div>
      `;

      let discountVal = 0;
      if (appliedCoupon) {
        discountVal = total * (appliedCoupon.discount / 100);
      }
      const finalTotal = total - discountVal;

      const summary = `
        ${couponHtml}
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span>${formatBRL(total)}</span>
          </div>
          ${appliedCoupon ? `
          <div class="summary-row" style="color:#1e8e3e;">
            <span>Desconto Aplicado (-${appliedCoupon.discount}%)</span>
            <span>-${formatBRL(discountVal)}</span>
          </div>
          ` : ''}
          <div class="summary-row summary-total">
            <span>Total</span>
            <span style="color:var(--gold)">${formatBRL(finalTotal)}</span>
          </div>
          
          <button class="btn-wpp-final" onclick="checkout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
              <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z" />
            </svg>
            Finalizar pelo WhatsApp
          </button>
        </div>
      `;

      container.innerHTML = `
        <div class="cart-grid">
          ${htmlList}
        </div>
        ${summary}
      `;
    }

    function checkout() {
      const cart = getCart();
      if(cart.length === 0) return;

      let msg = "Olá! Gostaria de estar adquirindo esses produtos:\n\n";

      cart.forEach(item => {
        let nameLine = `- ${item.quantidade}x "${item.nome}"`;
        if (item.variacao) {
          nameLine += ` (${item.variacao})`;
        }
        msg += nameLine + "\n";
      });

      const total = cart.reduce((sum, item) => sum + (item.preco * item.quantidade), 0);
      
      if (appliedCoupon) {
        const discountVal = total * (appliedCoupon.discount / 100);
        msg += `\n*Subtotal:* ${formatBRL(total)}`;
        msg += `\n*Desconto (${appliedCoupon.code} - ${appliedCoupon.discount}%):* -${formatBRL(discountVal)}`;
        msg += `\n*Valor Total:* ${formatBRL(total - discountVal)}`;
      } else {
        msg += `\n*Valor Total:* ${formatBRL(total)}`;
      }

      const btn = event.target;
      btn.style.opacity = '0.7';
      btn.textContent = 'Redirecionando...';

      // Redireciona e limpa carrinho opcionalmente (vamos deixar o cliente limpar ou manter)
      setTimeout(() => {
        const url = `https://wa.me/${getStoreWpp()}?text=${encodeURIComponent(msg)}`;
        window.location.href = url;
      }, 500);
    }

    // Ouve mudanças de abas para manter o carrinho sincronizado visualmente
    window.addEventListener('storage', renderCart);
    document.addEventListener('DOMContentLoaded', renderCart);

  </script>
</body>
</html>
